name: Linux

on:
  push:
    branches: [main]
  pull_request:

# Pull requests: one group per PR, and a new push cancels the run still going. Pushes to main and manual runs
# get a group of their own (the run id), so they are never cancelled.
concurrency:
  group: linux-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  strings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Every String Catalog key translated in all supported languages, matching format specifiers, and
      # no UI string in the Swift sources missing from its target's catalog. See docs/LOCALIZATION.md.
      - name: Check localizations
        run: python3 scripts/check_strings.py

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # docs/site/ is generated from docs/site-src/ (templates + one strings file per language). Fails if a
      # strings file is missing keys or has extra ones, or if the committed pages differ from a fresh build.
      - name: Check the generated website
        run: python3 scripts/site/build.py --check

      # robots.txt / sitemap.xml validation, folder URLs, JSON-LD, the Smart App Banner switch, title lengths.
      - name: Test the site generator
        run: python3 -B -m unittest discover -s scripts/site -v

  ci-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The App Store screenshot tooling of macos.yml: which simulator each display class is captured on, and
      # the check of the captured sizes against the sizes App Store Connect accepts. See docs/appstore/SCREENSHOTS.md.
      - name: Test the App Store screenshot scripts
        run: |
          python3 scripts/ci/appstore_simulator.py --self-test
          python3 scripts/ci/check_screenshot_sizes.py --self-test

      # Which macOS platforms a PR needs (macos.yml / accessibility.yml job `scope`).
      - name: Test the platform picker
        run: python3 scripts/ci/pick_platforms.py --self-test

      # The App Store listing text (docs/appstore/LISTING.md): every field of every language within App Store
      # Connect's limits, third-party names only in the description, no pricing.
      - name: Check the App Store listing
        run: |
          python3 scripts/ci/check_listing.py --self-test
          python3 scripts/ci/check_listing.py

  samples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The bundled sample books (iOSApp/Resources/SampleBooks) are built from docs/samples-src; fails if a committed
      # EPUB differs from a fresh build or a source is malformed. See docs/SAMPLE_BOOKS.md.
      - name: Check the sample books
        run: python3 scripts/samples/build_samples.py --check

  test-core:
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # .build holds absolute paths (module cache, PCH): the key includes the repository name so a rename
      # (wristreader -> folito changed the workspace path) cannot restore an incompatible build.
      - name: Cache SwiftPM
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Packages/ReaderCore/.build
          key: spm-${{ runner.os }}-${{ github.event.repository.name }}-${{ hashFiles('Packages/ReaderCore/Package.swift', 'Packages/ReaderCore/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-${{ github.event.repository.name }}-

      - name: Test ReaderCore
        working-directory: Packages/ReaderCore
        run: swift test

  # One live request to Open Library (docs/ONLINE_METADATA.md): the Books API by ISBN, to notice a change in
  # their answer format. Network errors skip the test instead of failing it.
  openlibrary-smoke:
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Same cache as test-core (key includes the repository name; see the comment there).
      - name: Cache SwiftPM
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Packages/ReaderCore/.build
          key: spm-${{ runner.os }}-${{ github.event.repository.name }}-${{ hashFiles('Packages/ReaderCore/Package.swift', 'Packages/ReaderCore/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-${{ github.event.repository.name }}-

      - name: Live smoke test against Open Library
        working-directory: Packages/ReaderCore
        env:
          OPENLIBRARY_LIVE_TEST: "1"
        run: swift test --filter OpenLibraryLiveTests

  kosync-integration:
    runs-on: ubuntu-latest
    container: swift:6.0
    services:
      kosync:
        image: koreader/kosync:latest
        ports:
          - 17200:17200
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # .build holds absolute paths (module cache, PCH): the key includes the repository name so a rename
      # (wristreader -> folito changed the workspace path) cannot restore an incompatible build.
      - name: Cache SwiftPM
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Packages/ReaderCore/.build
          key: spm-${{ runner.os }}-${{ github.event.repository.name }}-${{ hashFiles('Packages/ReaderCore/Package.swift', 'Packages/ReaderCore/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-${{ github.event.repository.name }}-

      # Plain bash (/dev/tcp), no apt: the container's package mirrors are sometimes unreachable, and a
      # failed `apt-get install curl` used to fail this job before any test ran.
      - name: Wait for KOSync server
        shell: bash
        run: |
          for i in $(seq 1 60); do
            if (exec 3<>/dev/tcp/kosync/17200 &&
                printf 'GET /healthcheck HTTP/1.0\r\nHost: kosync\r\nAccept: application/vnd.koreader.v1+json\r\n\r\n' >&3 &&
                timeout 5 cat <&3) 2>/dev/null | grep -q OK; then exit 0; fi
            sleep 2
          done
          echo "server did not become healthy"; exit 1

      - name: Integration tests against real koreader-sync-server
        working-directory: Packages/ReaderCore
        env:
          KOSYNC_TEST_URL: http://kosync:17200
        run: swift test --filter KOSync

  # Live test against Readest Cloud (docs/READEST_SYNC.md). Runs only when the repository secrets
  # READEST_TEST_EMAIL and READEST_TEST_PASSWORD exist (never on forks); use a dedicated test account.
  # The test skips itself when they are empty and never prints them.
  readest-integration:
    runs-on: ubuntu-latest
    container: swift:6.0
    env:
      READEST_TEST_EMAIL: ${{ secrets.READEST_TEST_EMAIL }}
      READEST_TEST_PASSWORD: ${{ secrets.READEST_TEST_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Same cache as test-core (key includes the repository name; see the comment there).
      - name: Cache SwiftPM
        if: env.READEST_TEST_EMAIL != '' && env.READEST_TEST_PASSWORD != ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Packages/ReaderCore/.build
          key: spm-${{ runner.os }}-${{ github.event.repository.name }}-${{ hashFiles('Packages/ReaderCore/Package.swift', 'Packages/ReaderCore/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-${{ github.event.repository.name }}-

      - name: Integration test against Readest Cloud
        if: env.READEST_TEST_EMAIL != '' && env.READEST_TEST_PASSWORD != ''
        working-directory: Packages/ReaderCore
        run: swift test --filter ReadestIntegrationTests

      - name: Skipped (no Readest test secrets)
        if: env.READEST_TEST_EMAIL == '' || env.READEST_TEST_PASSWORD == ''
        run: echo "READEST_TEST_EMAIL / READEST_TEST_PASSWORD secrets not set; skipping the live Readest test."
