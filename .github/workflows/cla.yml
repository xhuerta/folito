name: CLA

# Asks pull request authors to sign CLA.md and records signatures in
# signatures/version1/cla.json on the `cla-signatures` branch (not main).
#
# Security: this workflow runs with write permissions on pull_request_target,
# so it must never check out or run code from the pull request. It only calls
# the CLA action, which reads PR metadata and comments through the API.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: >-
          (github.event_name == 'pull_request_target') ||
          (github.event.issue.pull_request &&
           (github.event.comment.body == 'recheck' ||
            github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/version1/cla.json
          path-to-document: https://github.com/xhuerta/wristreader/blob/main/CLA.md
          # Must exist and must not be protected; keeps signature commits off main.
          branch: cla-signatures
          allowlist: xhuerta,dependabot[bot],github-actions[bot]
