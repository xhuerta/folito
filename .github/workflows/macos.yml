name: macOS

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # GitHub's macOS arm64 pool (macos-latest / macos-15 / macos-26) has been
    # capacity-constrained: jobs sat queued and were dropped with "The job was
    # not acquired by Runner of type hosted even after multiple attempts".
    # Pin an explicit label and default to the Intel pool, which is not
    # affected. Set the repository variable MACOS_RUNNER (e.g. to `macos-15`)
    # to switch back to arm64 without editing this file.
    runs-on: ${{ vars.MACOS_RUNNER || 'macos-15-intel' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain and simulators
        run: |
          uname -m
          xcodebuild -version
          xcrun simctl list runtimes available

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swift-package-manager
            SourcePackages
            Packages/ReaderCore/.build
          key: spm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Packages/ReaderCore/Package.swift', 'Packages/ReaderCore/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-${{ runner.arch }}-

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Test ReaderCore
        working-directory: Packages/ReaderCore
        run: swift test

      - name: Test iOS app (simulator)
        run: |
          set -o pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          c=[x for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')]
          print(c[-1]['udid'] if c else '')")
          echo "iOS simulator: $UDID"
          [ -n "$UDID" ] || { xcrun simctl list devices available; exit 1; }
          echo "IOS_SIM_UDID=$UDID" >> "$GITHUB_ENV"
          rm -rf ios-tests.xcresult
          # Unit tests only; the accessibility-audit UI tests run in their own step below.
          xcodebuild test \
            -project WristReader.xcodeproj \
            -scheme WristReader \
            -destination "id=$UDID" \
            -skip-testing:WristReaderUITests \
            -clonedSourcePackagesDirPath SourcePackages \
            -resultBundlePath ios-tests.xcresult \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee ios-tests.log

      - name: iOS test summary
        if: always()
        run: |
          grep -E "Test Case .*(passed|failed)|Executed [0-9]+ tests|error:" ios-tests.log || true
          xcrun xcresulttool get test-results summary --path ios-tests.xcresult || true

      - name: Upload iOS xcresult
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-tests-xcresult
          path: ios-tests.xcresult

      - name: Test watchOS app (simulator)
        run: |
          set -o pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          c=[x for k,v in d.items() if 'watchOS' in k for x in v if x['name'].startswith('Apple Watch')]
          print(c[-1]['udid'] if c else '')")
          if [ -z "$UDID" ]; then
            RT=$(xcrun simctl list runtimes available -j | python3 -c "
          import json,sys
          r=[x['identifier'] for x in json.load(sys.stdin)['runtimes'] if x['identifier'].split('.')[-1].startswith('watchOS')]
          print(r[-1] if r else '')")
            DT=$(xcrun simctl list devicetypes -j | python3 -c "
          import json,sys
          t=[x['identifier'] for x in json.load(sys.stdin)['devicetypes'] if 'Apple-Watch' in x['identifier']]
          print(t[-1] if t else '')")
            echo "creating watch simulator: $DT / $RT"
            UDID=$(xcrun simctl create "CI Watch" "$DT" "$RT")
          fi
          echo "watchOS simulator: $UDID"
          echo "WATCH_SIM_UDID=$UDID" >> "$GITHUB_ENV"
          rm -rf watch-tests.xcresult
          # Unit tests only; the watch accessibility UI tests run in their own step below.
          xcodebuild test \
            -project WristReader.xcodeproj \
            -scheme WristReaderWatch \
            -destination "id=$UDID" \
            -skip-testing:WristReaderWatchUITests \
            -clonedSourcePackagesDirPath SourcePackages \
            -resultBundlePath watch-tests.xcresult \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee watch-tests.log

      - name: watchOS test summary
        if: always()
        run: |
          grep -E "Test Case .*(passed|failed)|Executed [0-9]+ tests|error:" watch-tests.log || true
          xcrun xcresulttool get test-results summary --path watch-tests.xcresult || true

      - name: Upload watchOS xcresult
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: watch-tests-xcresult
          path: watch-tests.xcresult

      # Accessibility audits (WristReaderUITests) on the same iPhone simulator. Runs last and even when an
      # earlier step failed, so audit findings never hide the unit-test results (and vice versa).
      - name: iOS accessibility audit (UI tests)
        if: always() && env.IOS_SIM_UDID != ''
        run: |
          set -o pipefail
          rm -rf ios-uitests.xcresult
          xcodebuild test \
            -project WristReader.xcodeproj \
            -scheme WristReader \
            -destination "id=$IOS_SIM_UDID" \
            -only-testing:WristReaderUITests \
            -clonedSourcePackagesDirPath SourcePackages \
            -resultBundlePath ios-uitests.xcresult \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee ios-uitests.log

      - name: iOS accessibility audit summary
        if: always() && env.IOS_SIM_UDID != ''
        run: |
          grep -E "Test Case .*(passed|failed)|Executed [0-9]+ tests|error:|Accepted accessibility audit issue|Accessibility audit issue|Accessibility audit timed out" ios-uitests.log || true
          xcrun xcresulttool get test-results summary --path ios-uitests.xcresult || true

      - name: Upload iOS accessibility audit xcresult
        if: always() && env.IOS_SIM_UDID != ''
        uses: actions/upload-artifact@v4
        with:
          name: ios-uitests-xcresult
          path: ios-uitests.xcresult

      # Watch accessibility UI tests (WristReaderWatchUITests: automated audit + label / trait / AX5 text size
      # checks) on the same Apple Watch simulator as the watch unit tests. Like the iOS audit, it runs even when
      # an earlier step failed so its findings never hide the unit-test results (and vice versa).
      - name: watchOS accessibility UI tests
        if: always() && env.WATCH_SIM_UDID != ''
        # A hung simulator must not eat the whole job: stop here so the summary and xcresult steps still run.
        timeout-minutes: 30
        run: |
          set -o pipefail
          rm -rf watch-uitests.xcresult
          xcodebuild test \
            -project WristReader.xcodeproj \
            -scheme WristReaderWatch \
            -destination "id=$WATCH_SIM_UDID" \
            -only-testing:WristReaderWatchUITests \
            -clonedSourcePackagesDirPath SourcePackages \
            -resultBundlePath watch-uitests.xcresult \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee watch-uitests.log

      - name: watchOS accessibility UI tests summary
        if: always() && env.WATCH_SIM_UDID != ''
        run: |
          grep -E "Test Case .*(passed|failed)|Executed [0-9]+ tests|error:|Accessibility audit issue|Accessibility audit timed out" watch-uitests.log || true
          xcrun xcresulttool get test-results summary --path watch-uitests.xcresult || true

      - name: Upload watchOS accessibility UI tests xcresult
        if: always() && env.WATCH_SIM_UDID != ''
        uses: actions/upload-artifact@v4
        with:
          name: watch-uitests-xcresult
          path: watch-uitests.xcresult
          if-no-files-found: ignore
