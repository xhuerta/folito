name: macOS

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # GitHub's macOS arm64 pool (macos-latest / macos-15 / macos-26) has been
    # capacity-constrained: jobs sat queued and were dropped with "The job was
    # not acquired by Runner of type hosted even after multiple attempts".
    # Pin an explicit label and default to the Intel pool, which is not
    # affected. Set the repository variable MACOS_RUNNER (e.g. to `macos-15`)
    # to switch back to arm64 without editing this file.
    runs-on: ${{ vars.MACOS_RUNNER || 'macos-15-intel' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain and simulators
        run: |
          uname -m
          xcodebuild -version
          xcrun simctl list runtimes available

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swift-package-manager
            SourcePackages
            Packages/ReaderCore/.build
          key: spm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Packages/ReaderCore/Package.swift', 'Packages/ReaderCore/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-${{ runner.arch }}-

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Test ReaderCore
        working-directory: Packages/ReaderCore
        run: swift test

      - name: Test iOS app (simulator)
        run: |
          set -o pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          c=[x for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')]
          print(c[-1]['udid'] if c else '')")
          echo "iOS simulator: $UDID"
          [ -n "$UDID" ] || { xcrun simctl list devices available; exit 1; }
          rm -rf ios-tests.xcresult
          # Unit tests only; the accessibility-audit UI tests run in accessibility.yml (not PR-blocking).
          xcodebuild test \
            -project WristReader.xcodeproj \
            -scheme WristReader \
            -destination "id=$UDID" \
            -skip-testing:WristReaderUITests \
            -clonedSourcePackagesDirPath SourcePackages \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 180 -maximum-test-execution-time-allowance 300 \
            -resultBundlePath ios-tests.xcresult \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee ios-tests.log

      - name: iOS test summary
        if: always()
        run: |
          grep -E "Test Case .*(passed|failed)|Executed [0-9]+ tests|error:" ios-tests.log || true
          xcrun xcresulttool get test-results summary --path ios-tests.xcresult || true

      - name: Upload iOS xcresult
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-tests-xcresult
          path: ios-tests.xcresult

      - name: Test watchOS app (simulator)
        run: |
          set -o pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          c=[x for k,v in d.items() if 'watchOS' in k for x in v if x['name'].startswith('Apple Watch')]
          print(c[-1]['udid'] if c else '')")
          if [ -z "$UDID" ]; then
            RT=$(xcrun simctl list runtimes available -j | python3 -c "
          import json,sys
          r=[x['identifier'] for x in json.load(sys.stdin)['runtimes'] if x['identifier'].split('.')[-1].startswith('watchOS')]
          print(r[-1] if r else '')")
            DT=$(xcrun simctl list devicetypes -j | python3 -c "
          import json,sys
          t=[x['identifier'] for x in json.load(sys.stdin)['devicetypes'] if 'Apple-Watch' in x['identifier']]
          print(t[-1] if t else '')")
            echo "creating watch simulator: $DT / $RT"
            UDID=$(xcrun simctl create "CI Watch" "$DT" "$RT")
          fi
          echo "watchOS simulator: $UDID"
          rm -rf watch-tests.xcresult
          xcodebuild test \
            -project WristReader.xcodeproj \
            -scheme WristReaderWatch \
            -destination "id=$UDID" \
            -clonedSourcePackagesDirPath SourcePackages \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 180 -maximum-test-execution-time-allowance 300 \
            -resultBundlePath watch-tests.xcresult \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee watch-tests.log

      - name: watchOS test summary
        if: always()
        run: |
          grep -E "Test Case .*(passed|failed)|Executed [0-9]+ tests|error:" watch-tests.log || true
          xcrun xcresulttool get test-results summary --path watch-tests.xcresult || true

      - name: Upload watchOS xcresult
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: watch-tests-xcresult
          path: watch-tests.xcresult

      # The catalogs are hand-checked on Linux by scripts/check_strings.py; here they are compared with the keys
      # the Swift compiler actually extracted while building both apps (SWIFT_EMIT_LOC_STRINGS). If the build
      # rewrote a catalog, the rewritten files are uploaded so they can be committed as Xcode writes them.
      - name: Compare String Catalogs with Xcode's extraction
        if: always()
        run: |
          python3 scripts/compare_extracted_strings.py ~/Library/Developer/Xcode/DerivedData
          if git status --porcelain -- '*.xcstrings' | grep -q .; then
            echo "::warning::The build rewrote String Catalogs:"; git diff --stat -- '*.xcstrings'
          else
            echo "The build left the String Catalogs unchanged."
          fi

      - name: Upload String Catalogs as written by the build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcstrings-after-build
          path: |
            iOSApp/Resources/*.xcstrings
            WatchApp/Resources/*.xcstrings
