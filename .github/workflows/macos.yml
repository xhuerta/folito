name: macOS

# Builds the iPhone and watch apps and runs their tests on simulators, as two parallel jobs, in two tiers:
#  * fast tier (every push of a non-draft PR): build + unit tests. A PR that only touches iOSApp/ skips the watch
#    job and one that only touches WatchApp/ or WatchWidgets/ skips the iOS job (scripts/ci/pick_platforms.py).
#  * UI tier (pushes to main, manual runs, and PRs labelled `ui`): the same jobs go on, after the unit tests, to
#    the screenshot UI suites (iPhone: welcome tour, Readest library, covers, online metadata; watch: covers) and
#    export the complication screenshots. Adding the `ui` label starts a run; no new push is needed.
# ReaderCore's own `swift test` runs on Linux (linux.yml); the package has no Apple-only code paths and is
# compiled here as part of both apps. The slow accessibility UI audits run in accessibility.yml.
# See docs/TESTING.md ("CI: which workflow runs when").

on:
  push:
    branches: [main]
    # Docs-only / tooling-only changes skip this workflow (no branch protection requires it).
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "scripts/kosync-server/**"
      - "scripts/check_real_books.sh"
      - "scripts/make_icons.py"
      - "scripts/partial_md5_*"
      - ".github/workflows/linux.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/release-check.yml"
      - ".github/workflows/accessibility.yml"
      - ".github/workflows/cla.yml"
  pull_request:
    # ready_for_review: draft PRs skip the macOS jobs; they run when the PR is marked ready.
    # labeled: adding the `ui` label runs the UI tier at once (any other label is a no-op, see `scope`).
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "scripts/kosync-server/**"
      - "scripts/check_real_books.sh"
      - "scripts/make_icons.py"
      - "scripts/partial_md5_*"
      - ".github/workflows/linux.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/release-check.yml"
      - ".github/workflows/accessibility.yml"
      - ".github/workflows/cla.yml"
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner label override (e.g. macos-15-intel)"
        type: string
        required: false

# A new push cancels the run of the previous one. A label other than `ui` starts a run that does nothing; it gets
# a group of its own so that it does not cancel the real run of the same PR.
concurrency:
  group: macos-${{ github.ref }}${{ github.event.action == 'labeled' && github.event.label.name != 'ui' && '-other-label' || '' }}
  cancel-in-progress: true

jobs:
  # Which of the two macOS jobs this change needs (a few seconds on Linux).
  scope:
    name: scope
    if: >-
      github.event.pull_request.draft != true &&
      (github.event.action != 'labeled' || github.event.label.name == 'ui')
    runs-on: ubuntu-latest
    outputs:
      platforms: ${{ steps.pick.outputs.platforms }}
    steps:
      - uses: actions/checkout@v4

      - name: Pick platforms from the changed paths
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # Pushes to main and manual runs build both; so does a PR whose file list cannot be read.
          : > changed.txt
          if [ -n "$PR" ]; then
            gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" \
              --jq '.[] | .filename, (.previous_filename // empty)' > changed.txt || : > changed.txt
          fi
          python3 scripts/ci/pick_platforms.py < changed.txt | tee -a "$GITHUB_OUTPUT"

  test:
    name: ${{ matrix.platform }}
    needs: scope
    # Default: arm64 `macos-15` (free for public repos and ~2x faster than Intel; see docs/TESTING.md for
    # the measurements). If the arm64 pool is capacity-constrained again (jobs queued for a long time or
    # "not acquired by Runner"), set the repository variable MACOS_RUNNER to `macos-15-intel`.
    runs-on: ${{ inputs.runner || vars.MACOS_RUNNER || 'macos-15' }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.scope.outputs.platforms) }}
    env:
      SCHEME: ${{ matrix.platform == 'ios' && 'Folito' || 'FolitoWatch' }}
      SDK: ${{ matrix.platform == 'ios' && 'iOS Simulator' || 'watchOS Simulator' }}
      # The unit-test step skips the UI test bundle; its suites run in the UI tier and in accessibility.yml.
      UI_BUNDLE: ${{ matrix.platform == 'ios' && 'FolitoUITests' || 'FolitoWatchUITests' }}
      # UI tier: everything except a pull request without the `ui` label.
      UI_TIER: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ui') }}
      # Shared build settings: no indexing, no dSYMs, no signing, only the runner's architecture.
      XCB_FLAGS: >-
        -project Folito.xcodeproj
        -derivedDataPath DerivedData
        -clonedSourcePackagesDirPath SourcePackages
        -skipPackagePluginValidation -skipMacroValidation
        CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO DEBUG_INFORMATION_FORMAT=dwarf
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # Boots the simulator in the background while the app compiles (first CoreSimulator use takes ~1 min).
      - name: Boot simulator (background)
        run: |
          nohup scripts/ci/boot_simulator.sh ${{ matrix.platform }} "$RUNNER_TEMP/udid" > "$RUNNER_TEMP/boot.log" 2>&1 &
          uname -m
          xcodebuild -version
          echo "ARCH=$(uname -m)" >> "$GITHUB_ENV"

      - name: Install XcodeGen
        run: |
          # Prebuilt release binary (seconds) instead of `brew install` (~20 s); brew as a fallback.
          if curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" https://github.com/yonaskolb/XcodeGen/releases/download/2.44.1/xcodegen.zip; then
            unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xg"
            echo "$RUNNER_TEMP/xg/xcodegen/bin" >> "$GITHUB_PATH"
          else
            brew install xcodegen
          fi

      - name: Generate Xcode project
        run: xcodegen generate

      # SwiftPM checkouts only. Caching DerivedData was measured on PR #25 and did not pay off: the repository's
      # sources are recompiled on every checkout anyway, and restoring/saving ~160 MB cost as much as the few
      # third-party package compiles it saved.
      - name: Cache SwiftPM checkouts
        uses: actions/cache@v4
        with:
          path: SourcePackages
          key: spm-src-${{ hashFiles('Packages/ReaderCore/Package.resolved') }}
          restore-keys: spm-src-

      - name: Build for testing
        run: |
          xcodebuild build-for-testing $XCB_FLAGS \
            -scheme "$SCHEME" \
            -destination "generic/platform=$SDK" \
            ARCHS="$ARCH" ONLY_ACTIVE_ARCH=YES \
            -showBuildTimingSummary > build.log 2>&1 || { grep -E "error:" build.log; tail -80 build.log; exit 1; }
          grep -E "^Resolved source packages|warning:" build.log | sort -u | head -40 || true
          sed -n '/Build Timing Summary/,$p' build.log | head -40 || true

      - name: Wait for simulator
        timeout-minutes: 8
        run: |
          until [ -s "$RUNNER_TEMP/udid" ] && grep -q booted "$RUNNER_TEMP/boot.log"; do
            if ! pgrep -f boot_simulator.sh >/dev/null && ! grep -q booted "$RUNNER_TEMP/boot.log"; then
              tail -40 "$RUNNER_TEMP/boot.log"; exit 1
            fi
            sleep 2
          done
          grep -v -E "^\s|^\[|^$" "$RUNNER_TEMP/boot.log" || true
          echo "UDID=$(cat "$RUNNER_TEMP/udid")" >> "$GITHUB_ENV"

      - name: Run tests
        run: |
          set -o pipefail
          rm -rf ${{ matrix.platform }}-tests.xcresult
          xcodebuild test-without-building $XCB_FLAGS \
            -scheme "$SCHEME" \
            -destination "id=$UDID" \
            -skip-testing:"$UI_BUNDLE" \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 180 -maximum-test-execution-time-allowance 300 \
            -resultBundlePath ${{ matrix.platform }}-tests.xcresult 2>&1 | tee ${{ matrix.platform }}-tests.log

      # UI tier, iPhone: the four screenshot suites of iOSApp/UITests in one xcodebuild call and one result bundle.
      #  * OnboardingUITests: the welcome tour, the sample book, Skip, reopening from Settings.
      #  * ReadestLibraryUITests (mocked Readest account): cloud-only rows, downloads, menus, filter, offline.
      #  * CoversUITests (`-UITestingSeedCovers`): Library with covers, placeholder, book detail, largest text.
      #  * OnlineMetadataUITests (`-UITestingMockOnlineMetadata`, no network): Settings > Book Details, Find
      #    Details Online, the confirmation sheet, Remove Online Details.
      # The accessibility audits in the same bundle run in accessibility.yml.
      - name: UI tests (welcome tour, Readest library, covers, online metadata)
        if: env.UI_TIER == 'true' && matrix.platform == 'ios'
        run: |
          set -o pipefail
          rm -rf ios-ui-tests.xcresult
          xcodebuild test-without-building $XCB_FLAGS \
            -scheme "$SCHEME" \
            -destination "id=$UDID" \
            -only-testing:FolitoUITests/OnboardingUITests \
            -only-testing:FolitoUITests/ReadestLibraryUITests \
            -only-testing:FolitoUITests/CoversUITests \
            -only-testing:FolitoUITests/OnlineMetadataUITests \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 180 -maximum-test-execution-time-allowance 300 \
            -resultBundlePath ios-ui-tests.xcresult 2>&1 | tee ios-ui-tests.log

      # Every screen the suites visit is attached as a screenshot; one artifact per suite, PNGs named after the
      # attachments (default-1-welcome.png, ...).
      - name: Export UI test screenshots
        if: always() && env.UI_TIER == 'true' && matrix.platform == 'ios'
        run: |
          [ -d ios-ui-tests.xcresult ] || exit 0
          grep -E "Test Case .*(passed|failed)|Executed [0-9]+ tests|error:" ios-ui-tests.log || true
          xcrun xcresulttool export attachments --path ios-ui-tests.xcresult --output-path ui-attachments || true
          python3 scripts/ci/split_ui_attachments.py ui-attachments \
            OnboardingUITests=onboarding-screenshots \
            ReadestLibraryUITests=readest-library-screenshots \
            CoversUITests=covers-iphone \
            OnlineMetadataUITests=online-metadata-screenshots || true
          ls onboarding-screenshots readest-library-screenshots covers-iphone online-metadata-screenshots || true

      - name: Upload welcome tour screenshots
        if: always() && env.UI_TIER == 'true' && matrix.platform == 'ios'
        uses: actions/upload-artifact@v4
        with:
          name: onboarding-screenshots
          path: |
            onboarding-screenshots
            ios-ui-tests.log
          if-no-files-found: ignore

      - name: Upload Readest library screenshots
        if: always() && env.UI_TIER == 'true' && matrix.platform == 'ios'
        uses: actions/upload-artifact@v4
        with:
          name: readest-library-screenshots
          path: |
            readest-library-screenshots
            ios-ui-tests.log
          if-no-files-found: ignore

      - name: Upload covers screenshots (iPhone)
        if: always() && env.UI_TIER == 'true' && matrix.platform == 'ios'
        uses: actions/upload-artifact@v4
        with:
          name: covers-iphone
          path: |
            covers-iphone
            ios-ui-tests.log
          if-no-files-found: ignore

      - name: Upload online metadata screenshots
        if: always() && env.UI_TIER == 'true' && matrix.platform == 'ios'
        uses: actions/upload-artifact@v4
        with:
          name: online-metadata-screenshots
          path: |
            online-metadata-screenshots
            ios-ui-tests.log
          if-no-files-found: ignore

      # Watch Library with Settings > Show Covers on and off, at the default and the largest accessibility text size
      # (WatchApp/UITests/WatchCoversScreenshotTests.swift). UI tier: on main on the smallest and the largest watch
      # simulator the runner has, on a PR labelled `ui` only on the simulator the unit tests ran on. Exported as
      # the covers-watch artifact.
      - name: Watch covers screenshots
        if: env.UI_TIER == 'true' && matrix.platform == 'watch'
        timeout-minutes: 15
        run: |
          set -o pipefail
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            PICK=$UDID
          else
            PICK=$(xcrun simctl list devices available -j | python3 scripts/ci/pick_watch_sizes.py)
          fi
          echo "watch simulators: $PICK"
          mkdir -p covers-watch
          status=0
          for U in $PICK; do
            [ "$U" = "$UDID" ] || xcrun simctl bootstatus "$U" -b > /dev/null
            rm -rf "covers-watch-$U.xcresult"
            xcodebuild test-without-building $XCB_FLAGS \
              -scheme "$SCHEME" \
              -destination "id=$U" \
              -only-testing:FolitoWatchUITests/WatchCoversScreenshotTests \
              -test-timeouts-enabled YES -default-test-execution-time-allowance 180 -maximum-test-execution-time-allowance 300 \
              -resultBundlePath "covers-watch-$U.xcresult" 2>&1 | tee -a covers-watch.log || status=1
            mkdir -p "covers-watch/$U"
            xcrun xcresulttool export attachments --path "covers-watch-$U.xcresult" --output-path "covers-watch/$U" || true
            python3 scripts/ci/name_attachments.py "covers-watch/$U" || true
            mv covers-watch/$U/*.png covers-watch/ 2>/dev/null || true
            rm -rf "covers-watch/$U"
            [ "$U" = "$UDID" ] || xcrun simctl shutdown "$U" || true
          done
          grep -E "Test Case .*(passed|failed)|Executed [0-9]+ tests|error:" covers-watch.log || true
          ls covers-watch
          exit $status

      - name: Upload covers screenshots (watch)
        if: always() && env.UI_TIER == 'true' && matrix.platform == 'watch'
        uses: actions/upload-artifact@v4
        with:
          name: covers-watch
          path: |
            covers-watch
            covers-watch.log
          if-no-files-found: ignore

      # Complication / Smart Stack images rendered by WatchApp/Tests/ComplicationSnapshotTests.swift (every family:
      # default, tinted, redacted, Always On, placeholder, plus a contact sheet), exported from the watch test
      # results as the complication-screenshots artifact for design review.
      - name: Export complication screenshots
        if: always() && env.UI_TIER == 'true' && matrix.platform == 'watch'
        run: |
          [ -d watch-tests.xcresult ] || exit 0
          mkdir -p complication-screenshots
          xcrun xcresulttool export attachments --path watch-tests.xcresult --output-path complication-screenshots \
            --test-id "ComplicationSnapshotTests/testRenderAllFamilies()" || \
            xcrun xcresulttool export attachments --path watch-tests.xcresult --output-path complication-screenshots || true
          python3 - <<'PY' || true
          import json, pathlib
          out = pathlib.Path("complication-screenshots")
          for test in json.loads((out / "manifest.json").read_text()):
              for a in test.get("attachments", []):
                  src, name = out / a["exportedFileName"], a.get("suggestedHumanReadableName", "")
                  if not src.exists():
                      continue
                  if "ComplicationSnapshotTests" not in test.get("testIdentifier", "ComplicationSnapshotTests"):
                      src.unlink()
                      continue
                  if name:
                      stem = name.rsplit(".", 1)[0].split("_")[0] if name.count("_") >= 2 else name.rsplit(".", 1)[0]
                      src.rename(out / (stem + src.suffix))
          PY
          ls complication-screenshots
          ls complication-screenshots/*.png >/dev/null 2>&1 || echo "::warning::no complication screenshots were exported"

      - name: Upload complication screenshots
        if: always() && env.UI_TIER == 'true' && matrix.platform == 'watch'
        uses: actions/upload-artifact@v4
        with:
          name: complication-screenshots
          path: complication-screenshots
          if-no-files-found: ignore

      - name: Test summary
        if: always()
        run: |
          grep -E "Test Case .*(passed|failed)|Executed [0-9]+ tests|error:" ${{ matrix.platform }}-tests.log || true
          xcrun xcresulttool get test-results summary --path ${{ matrix.platform }}-tests.xcresult || true

      - name: Upload xcresult
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-tests-xcresult
          path: |
            ${{ matrix.platform }}-tests.xcresult
            build.log
          if-no-files-found: ignore

      # The catalogs are hand-checked on Linux by scripts/check_strings.py; here they are compared with the keys
      # the Swift compiler actually extracted while building both apps (SWIFT_EMIT_LOC_STRINGS). The iOS job
      # builds the embedded watch app too, so it covers all targets; when a watch-only PR skips the iOS job, the
      # watch job compares the watch targets instead. If the build rewrote a catalog, the rewritten files are
      # uploaded so they can be committed as Xcode writes them.
      - name: Compare String Catalogs with Xcode's extraction
        if: always() && (matrix.platform == 'ios' || !contains(needs.scope.outputs.platforms, 'ios'))
        run: |
          python3 scripts/compare_extracted_strings.py $STRING_TARGETS DerivedData
          if git status --porcelain -- '*.xcstrings' | grep -q .; then
            echo "::warning::The build rewrote String Catalogs:"; git diff --stat -- '*.xcstrings'
          else
            echo "The build left the String Catalogs unchanged."
          fi
        env:
          STRING_TARGETS: ${{ matrix.platform == 'watch' && '--targets FolitoWatch,FolitoWatchWidgets' || '' }}

      - name: Upload String Catalogs as written by the build
        if: always() && (matrix.platform == 'ios' || !contains(needs.scope.outputs.platforms, 'ios'))
        uses: actions/upload-artifact@v4
        with:
          name: xcstrings-after-build
          path: |
            iOSApp/Resources/*.xcstrings
            WatchApp/Resources/*.xcstrings
