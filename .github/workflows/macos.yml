name: macOS

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Test ReaderCore
        working-directory: Packages/ReaderCore
        run: swift test

      - name: Build iOS app (simulator)
        run: |
          xcodebuild build \
            -project WristReader.xcodeproj \
            -scheme WristReader \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

      - name: Build watchOS app (simulator)
        run: |
          xcodebuild build \
            -project WristReader.xcodeproj \
            -scheme WristReaderWatch \
            -destination 'generic/platform=watchOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

      - name: Compile iOS unit tests
        run: |
          xcodebuild build-for-testing \
            -project WristReader.xcodeproj \
            -scheme WristReader \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

      # The watch app has no usable test host (WKApplication, no XCTest host app), so the test bundle
      # cannot link; we only require that it compiles (any compiler error fails the step).
      - name: Compile watchOS unit tests
        run: |
          set +e
          xcodebuild build-for-testing \
            -project WristReader.xcodeproj \
            -scheme WristReaderWatch \
            -destination 'generic/platform=watchOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            TEST_HOST= BUNDLE_LOADER= 2>&1 | tee watch-tests.log
          if grep -E "error:" watch-tests.log | grep -v "linker command failed"; then exit 1; fi
          grep -q "Compiling.*TypographyDictionaryTests.swift\|TypographyDictionaryTests.swift" watch-tests.log
