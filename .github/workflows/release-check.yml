name: Release check

# Release archive + bundle validation. Slow and rarely affected by ordinary code changes, so on pull requests it
# runs only when release-relevant files change; every push to main runs it. Draft PRs skip it.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "project.yml"
      - "Config/**"
      - "**/*.xcassets/**"
      - "**/Info.plist"
      - "**/*.plist"
      - "**/*.entitlements"
      - "**/*.xcprivacy"
      - "**/InfoPlist.strings"
      - "**/InfoPlist.xcstrings"
      - "Packages/ReaderCore/Package.swift"
      - "Packages/ReaderCore/Package.resolved"
      - "scripts/validate_release.py"
      - ".github/workflows/release-check.yml"
  workflow_dispatch:

concurrency:
  group: release-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  archive:
    if: github.event.pull_request.draft != true
    # Same runner as macos.yml; set the repository variable MACOS_RUNNER to override.
    runs-on: ${{ vars.MACOS_RUNNER || 'macos-15' }}
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: SourcePackages
          key: spm-release-${{ runner.os }}-${{ hashFiles('Packages/ReaderCore/Package.swift', 'Packages/ReaderCore/Package.resolved') }}
          restore-keys: spm-release-${{ runner.os }}-

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Validate source asset catalogs
        run: python3 scripts/validate_release.py

      # iOS archive also builds and embeds the watch app (Release, device SDKs).
      - name: Archive iOS app (Release)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Folito.xcodeproj -scheme Folito -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/Folito.xcarchive \
            -derivedDataPath build/DerivedData \
            -clonedSourcePackagesDirPath SourcePackages \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee archive-ios.log

      # The watch target is SKIP_INSTALL=YES (it ships inside the iOS archive); override so a
      # standalone archive of its scheme produces a bundle we can inspect.
      - name: Archive watch app (Release)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Folito.xcodeproj -scheme FolitoWatch -configuration Release \
            -destination "generic/platform=watchOS" \
            -archivePath build/FolitoWatch.xcarchive \
            -derivedDataPath build/DerivedData \
            -clonedSourcePackagesDirPath SourcePackages \
            CODE_SIGNING_ALLOWED=NO SKIP_INSTALL=NO 2>&1 | tee archive-watch.log

      - name: Validate built bundles
        run: |
          IOS_APP=$(ls -d build/Folito.xcarchive/Products/Applications/*.app | head -1)
          WATCH_STANDALONE=$(ls -d build/FolitoWatch.xcarchive/Products/Applications/*.app | head -1)
          ARGS=(--ios-app "$IOS_APP" --watch-app "$WATCH_STANDALONE")
          if [ -d "$IOS_APP/Watch" ]; then
            ARGS+=(--watch-app "$(ls -d "$IOS_APP"/Watch/*.app | head -1)")
          fi
          python3 scripts/validate_release.py "${ARGS[@]}"
        env:
          # Real bundle ids are in place: fail if a com.example.* id ever comes back.
          RELEASE_STRICT: "1"

      - name: Show warnings
        if: always()
        run: grep -hE "warning:.*(asset|icon|AppIcon|Assets)|error:" archive-*.log || true
