name: WristReader

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"
    watchOS: "9.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

# Defaults live in Config/Base.xcconfig; per-developer overrides (DEVELOPMENT_TEAM,
# unique bundle ids) go in the gitignored Config/Local.xcconfig.
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  ReaderCore:
    path: Packages/ReaderCore

targets:
  WristReader:
    type: application
    platform: iOS
    sources:
      - path: iOSApp
        excludes:
          - Tests/**
          - Info.plist
      # SwiftUI code compiled into both apps (typography rendering, block text).
      - path: Shared
    dependencies:
      - package: ReaderCore
      # Embeds the watch app into the iPhone app bundle.
      - target: WristReaderWatch
        embed: true
    info:
      path: GeneratedInfo/iOS-Info.plist
      properties:
        CFBundleDisplayName: WristReader
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # ATS (#9): https stays the default. NSAllowsLocalNetworking lets plain http:// reach
        # local-network servers (IP addresses, *.local, dotless host names) without disabling ATS
        # elsewhere. For a self-hosted server on a public host name served over http, add a
        # per-domain exception (see README, "Servidor HTTP (ATS)"), e.g.:
        #   NSExceptionDomains:
        #     sync.example.org:
        #       NSExceptionAllowsInsecureHTTPLoads: true
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: EPUB Document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - org.idpf.epub-container
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: org.idpf.epub-container
            UTTypeDescription: EPUB Document
            UTTypeConformsTo:
              - public.data
              - public.composite-content
            UTTypeTagSpecification:
              public.filename-extension:
                - epub
              public.mime-type:
                - application/epub+zip
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(WR_BUNDLE_ID)
        PRODUCT_NAME: WristReader
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO

  WristReaderWatch:
    type: application
    platform: watchOS
    sources:
      - path: WatchApp
        excludes:
          - Tests/**
      - path: Shared
    dependencies:
      - package: ReaderCore
    # Single-target watchOS app (no WatchKit extension) paired with the iOS app.
    info:
      path: GeneratedInfo/Watch-Info.plist
      properties:
        CFBundleDisplayName: WristReader
        WKApplication: true
        WKCompanionAppBundleIdentifier: $(WR_BUNDLE_ID)
        # ATS (#9): https stays the default. NSAllowsLocalNetworking lets plain http:// reach
        # local-network servers (IP addresses, *.local, dotless host names) without disabling ATS
        # elsewhere. For a self-hosted server on a public host name served over http, add a
        # per-domain exception (see README, "Servidor HTTP (ATS)"), e.g.:
        #   NSExceptionDomains:
        #     sync.example.org:
        #       NSExceptionAllowsInsecureHTTPLoads: true
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(WR_BUNDLE_ID).watchkitapp
        PRODUCT_NAME: WristReader
        # Distinct from the iOS app's module so WatchApp/Tests can `@testable import WristReaderWatch`.
        PRODUCT_MODULE_NAME: WristReaderWatch
        SDKROOT: watchos
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: NO

  WristReaderTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: iOSApp/Tests
        optional: true
    dependencies:
      - target: WristReader
      - package: ReaderCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(WR_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES

  WristReaderWatchTests:
    type: bundle.unit-test
    platform: watchOS
    sources:
      - path: WatchApp/Tests
        optional: true
    dependencies:
      - target: WristReaderWatch
      - package: ReaderCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(WR_BUNDLE_ID).watchtests
        # The watch app's PRODUCT_NAME is WristReader (not the target name), so XcodeGen's default
        # TEST_HOST (.../WristReaderWatch.app/WristReaderWatch) does not exist; point at the real product.
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/WristReader.app/WristReader
        BUNDLE_LOADER: $(TEST_HOST)
        GENERATE_INFOPLIST_FILE: YES

schemes:
  WristReader:
    build:
      targets:
        WristReader: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - WristReaderTests
    profile:
      config: Release
    archive:
      config: Release
  WristReaderWatch:
    build:
      targets:
        WristReaderWatch: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - WristReaderWatchTests
    profile:
      config: Release
    archive:
      config: Release
