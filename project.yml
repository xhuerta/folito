name: Folito

options:
  bundleIdPrefix: com.xlahuerta
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

# Defaults live in Config/Base.xcconfig; per-developer overrides (DEVELOPMENT_TEAM,
# unique bundle ids) go in the gitignored Config/Local.xcconfig.
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # Localization (docs/LOCALIZATION.md): each app has Resources/Localizable.xcstrings and
    # Resources/InfoPlist.xcstrings, picked up as resources through the target's source path (XcodeGen
    # also derives knownRegions from the catalogs' languages). Xcode extracts new strings into them on build.
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES

packages:
  ReaderCore:
    path: Packages/ReaderCore

targets:
  Folito:
    type: application
    platform: iOS
    sources:
      - path: iOSApp
        excludes:
          - Tests/**
          - UITests/**
          - Info.plist
      # SwiftUI code compiled into both apps (typography rendering, block text).
      - path: Shared
    dependencies:
      - package: ReaderCore
      # Embeds the watch app into the iPhone app bundle.
      - target: FolitoWatch
        embed: true
    info:
      path: GeneratedInfo/iOS-Info.plist
      properties:
        CFBundleDisplayName: $(WR_APP_NAME)
        # From Config/Base.xcconfig (or the release workflow's overrides); XcodeGen would otherwise write 1.0 (1).
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, es, fr, de, it, pt-BR, ja, zh-Hans]
        LSApplicationCategoryType: public.app-category.books
        # Only HTTPS (OS-provided TLS) and an MD5 hash used as the KOSync protocol's auth key: exempt.
        # See docs/EXPORT_COMPLIANCE.md.
        ITSAppUsesNonExemptEncryption: false
        # The user may point the app at a KOSync server on their LAN (IP / .local host).
        # Localized in iOSApp/Resources/InfoPlist.xcstrings (see docs/LOCALIZATION.md).
        NSLocalNetworkUsageDescription: Folito connects to your own KOReader sync server on your local network to sync your reading progress.
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # ATS (#9): https stays the default. NSAllowsLocalNetworking lets plain http:// reach
        # local-network servers (IP addresses, *.local, dotless host names) without disabling ATS
        # elsewhere. For a self-hosted server on a public host name served over http, add a
        # per-domain exception (see README, "HTTP servers (ATS)"), e.g.:
        #   NSExceptionDomains:
        #     sync.example.org:
        #       NSExceptionAllowsInsecureHTTPLoads: true
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: EPUB Document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - org.idpf.epub-container
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: org.idpf.epub-container
            UTTypeDescription: EPUB Document
            UTTypeConformsTo:
              - public.data
              - public.composite-content
            UTTypeTagSpecification:
              public.filename-extension:
                - epub
              public.mime-type:
                - application/epub+zip
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(WR_BUNDLE_ID)
        PRODUCT_NAME: Folito
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO

  FolitoWatch:
    type: application
    platform: watchOS
    sources:
      - path: WatchApp
        excludes:
          - Tests/**
          - UITests/**
      - path: Shared
    dependencies:
      - package: ReaderCore
    # Single-target watchOS app (no WatchKit extension) paired with the iOS app.
    info:
      path: GeneratedInfo/Watch-Info.plist
      properties:
        CFBundleDisplayName: $(WR_APP_NAME)
        # From Config/Base.xcconfig (or the release workflow's overrides); XcodeGen would otherwise write 1.0 (1).
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, es, fr, de, it, pt-BR, ja, zh-Hans]
        ITSAppUsesNonExemptEncryption: false
        NSLocalNetworkUsageDescription: Folito connects to your own KOReader sync server on your local network to sync your reading progress.
        WKApplication: true
        WKCompanionAppBundleIdentifier: $(WR_BUNDLE_ID)
        # Required for the app to be installable on a watch simulator that has no paired iPhone
        # (CI unit tests host); also valid for the app itself, which syncs over the network on its own.
        WKRunsIndependentlyOfCompanionApp: true
        # ATS (#9): https stays the default. NSAllowsLocalNetworking lets plain http:// reach
        # local-network servers (IP addresses, *.local, dotless host names) without disabling ATS
        # elsewhere. For a self-hosted server on a public host name served over http, add a
        # per-domain exception (see README, "HTTP servers (ATS)"), e.g.:
        #   NSExceptionDomains:
        #     sync.example.org:
        #       NSExceptionAllowsInsecureHTTPLoads: true
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(WR_BUNDLE_ID).watchkitapp
        PRODUCT_NAME: Folito
        # Distinct from the iOS app's module so WatchApp/Tests can `@testable import FolitoWatch`.
        PRODUCT_MODULE_NAME: FolitoWatch
        SDKROOT: watchos
        TARGETED_DEVICE_FAMILY: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: NO

  FolitoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: iOSApp/Tests
        optional: true
    dependencies:
      - target: Folito
      - package: ReaderCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(WR_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES

  # Automated accessibility audits (XCUIApplication.performAccessibilityAudit, iOS 17+). Launches the app with
  # -UITesting / -UITestingSeedSampleBook (handled in Debug builds only). See docs/ACCESSIBILITY.md.
  FolitoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: iOSApp/UITests
    dependencies:
      - target: Folito
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(WR_BUNDLE_ID).uitests
        TEST_TARGET_NAME: Folito
        GENERATE_INFOPLIST_FILE: YES

  FolitoWatchTests:
    type: bundle.unit-test
    platform: watchOS
    sources:
      - path: WatchApp/Tests
        optional: true
    dependencies:
      - target: FolitoWatch
      - package: ReaderCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(WR_BUNDLE_ID).watchtests
        # The watch app's PRODUCT_NAME is Folito (not the target name), so XcodeGen's default
        # TEST_HOST (.../FolitoWatch.app/FolitoWatch) does not exist; point at the real product.
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Folito.app/Folito
        BUNDLE_LOADER: $(TEST_HOST)
        GENERATE_INFOPLIST_FILE: YES

  # Watch accessibility UI tests: XCUIApplication.performAccessibilityAudit (available on watchOS 10+) plus
  # explicit label / trait / largest-text-size checks. Launches the watch app with -UITesting /
  # -UITestingSeedSampleBook (handled in Debug builds only). See docs/ACCESSIBILITY.md.
  FolitoWatchUITests:
    type: bundle.ui-testing
    platform: watchOS
    sources:
      - path: WatchApp/UITests
    dependencies:
      - target: FolitoWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(WR_BUNDLE_ID).watchuitests
        TEST_TARGET_NAME: FolitoWatch
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Folito:
    build:
      targets:
        Folito: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FolitoTests
        - FolitoUITests
    profile:
      config: Release
    archive:
      config: Release
  FolitoWatch:
    build:
      targets:
        FolitoWatch: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FolitoWatchTests
        - FolitoWatchUITests
    profile:
      config: Release
    archive:
      config: Release
